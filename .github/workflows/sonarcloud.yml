# SonarCloud code quality and security analysis.
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # `llvm-tools` carries the `llvm-profdata`/`llvm-cov` that read the
          # counters instrumented builds write.
          components: llvm-tools
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov

      # Without a report the quality gate reads new code as 0% covered and
      # fails every pull request that adds a line. `--all-features` covers
      # both suites the Test job in ci.yml runs (default and `cli`).
      - name: Coverage
        run: |
          cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
          echo "lcov.info: $(wc -l < lcov.info) lines"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.rust.lcov.reportPaths=lcov.info
            -Dsonar.exclusions=lcov.info,target/**
